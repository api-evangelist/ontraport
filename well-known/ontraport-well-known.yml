method: probed
source: live GET probes of every Ontraport host named in apis.yml, the OpenAPI servers[] block, and the MCP endpoint published at https://ontraport.com/support/My-account/mcp-server
description: >-
  Result of probing the standard /.well-known/ paths on every Ontraport host. Two
  paths return real documents: the RFC 9728 OAuth protected-resource metadata served
  by the Ontraport MCP server, and the RFC 8414 authorization-server metadata served
  by the Ontraport application. Together they are the machine-readable description of
  how an agent authorizes against Ontraport. Everything else 404s (ontraport.com,
  mcp.ontraport.com) or is fronted by an edge that answers 502 for unknown paths
  (api.ontraport.com) — recorded as an honest absence.
