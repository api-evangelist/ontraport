- aid: ontraport:mcp
  name: Ontraport MCP Server
  description: >-
    Ontraport's first-party, hosted, remote MCP server. A streamable-HTTP endpoint an agent
    POSTs to directly at https://mcp.ontraport.com — there is no package to install and no
    local stdio process. It is a translation layer over the Ontraport REST API exposing 47
    tools across four categories: generic CRUD, Query (structural discovery, engagement
    tracking, account health), Manage (tags, subscriptions, relationships, tasks) and
    Commerce (invoicing, payments, refunds, subscriptions). Authorization is OAuth 2.1 with
    PKCE S256 against https://app.ontraport.com under a single mcp:tools scope, with an
    Api-Appid/Api-Key header fallback for platforms that cannot run the OAuth flow.
  humanURL: https://ontraport.com/support/My-account/mcp-server
  baseURL: https://mcp.ontraport.com
