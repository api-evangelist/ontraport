aid: ontraport
name: Ontraport
description: >-
  Ontraport is a business automation platform combining CRM, marketing
  automation, email marketing, landing pages, ecommerce, and membership site
  capabilities for small businesses and entrepreneurs. The platform unifies
  contact management, sales pipelines, payment processing, and visual
  automation campaigns in a single workspace. Ontraport's REST API exposes
  contacts, transactions, tags, sequences, forms, landing pages, and
  ecommerce objects using API-Key and Api-Appid header authentication, through a
  generic object interface where the record type is selected by an integer object
  type ID rather than by a path segment. Ontraport also runs a first-party remote
  MCP server at https://mcp.ontraport.com, publishing 47 tools across CRUD, query,
  management and commerce and authorizing them with OAuth 2.1 (PKCE, dynamic client
  registration) under a single mcp:tools scope.
