sla:
  published: false
  uptime_commitment: null
  note: >-
    No uptime percentage, credit schedule or support-response commitment is published on
    the pricing page, the security page or the Terms of Service. Enterprise plans advertise
    "VIP support + onboarding" and dedicated infrastructure as features, not as a measured
    SLA.

