generated: '2026-08-13'
method: searched
source: >-
  https://ontraport.com/pricing and
  https://ontraport.com/support/My-account/grandfathered-account-pricing
description: >-
  Ontraport sells four named self-serve subscription tiers — Basic, Plus, Pro and Enterprise
  — plus a Custom level. The tier NAMES and the trial terms are published; the current
  PRICES are not machine-readable. ontraport.com/pricing renders its whole price table
  client-side from
  app.ontraport.com/js/ontraport/opt_assets/libraries/OptAccountPackageManager, whose
  server-rendered HTML contains only "$70" template placeholders — no plan price appears in
  the delivered document. The one price table Ontraport does publish as static HTML is the
  grandfathered reference for accounts created before 2022-06-30, recorded verbatim below
  and clearly labelled as legacy. No API-specific plan exists: the 180 req/min rate limit is
  account-scoped and identical on every tier, and increases are handled case-by-case by
  support rather than by purchasing a tier.
plan_count: 5
currency: USD
api_pricing: none
api_pricing_note: >-
  The API is included in every plan at no extra charge and carries no metered call cost. The
  only API-adjacent limit is the shared 180 requests/minute account budget documented at
  https://api.ontraport.com/doc/#rate-limiting.
trial:
  offered: true
  length_days: 14
  credit_card_required: false
  terms: >-
    "All plans start with a 14-day free trial. No credit card required to sign up." Upgrade
    happens inside the platform before the trial ends; no action is needed to avoid a charge.
billing:
  periods:
  - monthly
  - annual
  annual_discount: >-
    Annual subscriptions are a one-year commitment with two months free.
  refund: Full refund available within the first 30 days after signing up.
  cancellation: Self-serve from inside the account at any time.

