access_asymmetry:
  read_only_types: >-
    The majority of object types are GET-only through the API. Commerce is the sharpest
    case: Invoices (46), Payments (227) and Open Orders (44) accept no generic writes at
    all — every mutation must go through a purpose-built endpoint or MCP tool that carries
    the state-transition logic.
  full_crud_types:
  - Contact (0)
  - Note (12)
  - Tag (14)
  - Product (16)
  - Rule (6)
  - Deal (149)
  - Company (150)
  - Calendar Event (160)
  - custom objects (>= 10000)

derivation_note: >-
  This graph is NOT derived from the OpenAPI. The captured specs describe a generic
  interface with no per-entity schemas and no $refs between entities, so they contain no
  relationship information. Every entity, ID, access level and relationship above comes from
  the two published object tables named in `source`.
