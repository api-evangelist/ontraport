generated: '2026-08-13'
method: searched
source: >-
  https://api.ontraport.com/doc/#accessible-objects (object type IDs and per-verb access),
  https://ontraport.com/support/My-account/mcp-server (Available objects: groupings, access
  and the specialized tool bound to each object), and the generic object interface in
  openapi/ontraport-objects-api-openapi.yml
description: >-
  Ontraport's data model is unusual and worth stating plainly: there is ONE endpoint family
  and the entity is a parameter. Every record type is an "object" identified by an integer
  object type ID passed as objectID; Contact is 0, Task is 1, Note is 12, Deals is 149,
  custom objects are >= 10000 and vary per account. Relationships are not expressed as
  nested resources or $refs — they are separate join objects (Tag Subscribers 138, Sequence
  Subscribers 8, Custom Object Relationships 102) that must be read as first-class records.
  Consequently the entity graph cannot be derived from the OpenAPI at all; it is derived
  from the two published object tables.
root_entity: Contact
root_entity_id: 0
identifier_scheme:
  object_type_id: integer, identifies the TYPE; shared by every record of that type
  id: integer, identifies the RECORD; unique within a type
  unique_id: >-
    string, added 2018-06-27 to ORM objects. Not editable; can be supplied on update or
    saveorupdate to select the target record. GET by unique id added 2025-11-18
    (getByUniqueId).
  id_prefixes: none — Ontraport uses bare integers, so an ID is not self-describing
custom_objects:
  id_range: '>= 10000'
  per_account: true
  discovery: GET /objects/meta, or the MCP tool list_allowed_object_types
  note: >-
    Because custom objects and custom fields vary per account, no static schema for an
    Ontraport account exists. Field discovery is mandatory before any write against an
    unfamiliar account.

