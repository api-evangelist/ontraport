method: derived
source: >-
  mcp/ontraport-mcp.yml (tool names + descriptions transcribed from
  https://ontraport.com/support/My-account/mcp-server), openapi/ontraport-objects-api-openapi.yml,
  openapi/ontraport-metadata-api-openapi.yml, and the endpoint reference at
  https://api.ontraport.com/doc/
description: >-
  Binds each Ontraport MCP tool to the REST operation(s) that back it. Ontraport's MCP
  server is explicitly described by the provider as a translation layer over the Ontraport
  REST API, so most tools have a real REST ancestor — but the mapping is deliberately
  lopsided: the captured OpenAPI covers only the GENERIC object interface (/objects,
  /object, /objects/meta ...), while the MCP surface is dominated by purpose-built tools
  that wrap named REST resources documented in prose (Transaction/processManual,
  Webhook/subscribe, Calendar/*, objects/tag ...) and were never captured as machine-readable
  operations. Every one of those is recorded here honestly rather than being force-mapped.

surfaces:
  openapi:
  - file: openapi/ontraport-objects-api-openapi.yml
    operations: 8
    note: >-
      No operationIds are published by Ontraport. Stable operationIds are assigned by
      overlays/ontraport-objects-api-overlay.yaml and are used below, marked as
      overlay-assigned.
  - file: openapi/ontraport-metadata-api-openapi.yml
    operations: 3
    note: operationIds assigned by overlays/ontraport-metadata-api-overlay.yaml.
  graphql: null
  mcp:
    url: https://mcp.ontraport.com
    gated: true
    note: >-
      tools/list returns 401 with an RFC 9728 Bearer challenge. Tool names and descriptions
      come from the provider's published reference; inputSchemas are not public.
  rest_reference: https://api.ontraport.com/doc/

coverage:
  mcp_tools: 47
  openapi_operations: 11
  mapped: 12
  mcp_only: 35
  rest_only: 2
  confidence_note: >-
    No mapping is rated high. The MCP schemas are gated and the OpenAPI carries no
    operationIds, so every binding is name-and-semantics based against the provider's own
    prose. Ratings are medium where the tool and the operation are the same documented
    action on the same generic object interface, low where the tool clearly wraps a named
    REST resource that exists in the docs but not in the captured spec.

