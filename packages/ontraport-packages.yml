description: >-
  Ontraport publishes exactly one first-party client library: a PHP SDK. It is the SDK the
  entire REST reference is written against — every endpoint on https://api.ontraport.com/doc/
  carries a PHP example using it — and it is the only package Ontraport maintains. Its last
  release was v1.2.2 on 2022-09-28, which predates seven documented API changes (Tag
  Subscribers, getByUniqueId, the count parameter, Invoices/Payments/payInvoice, coupon
  codes on manual transactions and two Calendar guest parameters) shipped between 2023 and
  June 2026. There is no first-party JavaScript, Python, Ruby, Go, Java, .NET or Rust
  client. Everything on npm and RubyGems under the Ontraport name is community-authored and
  abandoned, the newest of them dating to 2021.
